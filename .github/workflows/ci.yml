name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every JavaScript file parses
        run: for f in src/*.js eval/*.mjs; do node --check "$f" || exit 1; done
      - name: The server compiles
        run: python -m py_compile server.py
      - name: Play 50 headless rounds with the real rules (scripted brains, no Ollama needed)
        run: |
          PILOT=1 node eval/run.mjs scripted-vs-scripted 50
          test "$(wc -l < eval/pilot.jsonl)" -eq 50
      - name: The results report builds from the saved data
        run: node eval/report.mjs
